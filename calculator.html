<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A scientific calculator for everyday and advanced maths.">
  <title>Calculator | Advanced Maths for GCSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calculator.css">
  <script src="calculator.js" defer></script>
</head>
<body class="calculator-page">
  <header class="site-header calculator-header">
    <a class="brand" href="index.html" aria-label="Advanced Maths for GCSE home">
      <span class="brand-mark">M</span>
      <span>Advanced Maths for GCSE</span>
    </a>
    <a class="back-link" href="index.html">&#8592; Home</a>
  </header>

  <main class="calculator-main">
    <section class="calculator-layout" aria-labelledby="calculator-title">
      <div class="calculator-heading">
        <p class="eyebrow">Mathematical tools</p>
        <h1 id="calculator-title">Scientific calculator</h1>
      </div>

      <div class="calculator" aria-label="Scientific calculator">
        <div class="calculator-display">
          <p class="calculator-expression" id="calculator-expression" aria-hidden="true"></p>
          <output class="calculator-value" id="calculator-value" aria-label="Calculator display" aria-live="polite">0</output>
        </div>
        <div class="calculator-keys" aria-label="Calculator keys">
          <button class="calculator-key calculator-key-mode" type="button" data-action="angle-mode" aria-label="Switch angle mode">DEG</button>
          <button class="calculator-key calculator-key-clear" type="button" data-action="clear">AC</button>
          <button class="calculator-key calculator-key-utility" type="button" data-action="delete" aria-label="Delete last character">&#9003;</button>
          <button class="calculator-key calculator-key-utility" type="button" data-insert="(" aria-label="Open parenthesis">(</button>
          <button class="calculator-key calculator-key-utility" type="button" data-insert=")" aria-label="Close parenthesis">)</button>

          <button class="calculator-key calculator-key-function" type="button" data-insert="sin(">sin</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="cos(">cos</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="tan(">tan</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="asin(">sin<sup>-1</sup></button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="acos(">cos<sup>-1</sup></button>

          <button class="calculator-key calculator-key-function" type="button" data-insert="atan(">tan<sup>-1</sup></button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="sqrt(">&#8730;</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="ln(">ln</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="log(">log</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="abs(">abs</button>

          <button class="calculator-key calculator-key-function" type="button" data-insert="^2">x<sup>2</sup></button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="^"><var>x</var><sup>y</sup></button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="!">x!</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="%">%</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="10^(">10<sup>x</sup></button>

          <button class="calculator-key calculator-key-constant" type="button" data-insert="pi">&#960;</button>
          <button class="calculator-key calculator-key-constant" type="button" data-insert="e">e</button>
          <button class="calculator-key calculator-key-constant" type="button" data-action="answer">Ans</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="exp(">e<sup>x</sup></button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="1/">1/x</button>

          <button class="calculator-key calculator-key-number" type="button" data-insert="7">7</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="8">8</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="9">9</button>
          <button class="calculator-key calculator-key-operator" type="button" data-insert="&#247;" aria-label="Divide">&#247;</button>
          <button class="calculator-key calculator-key-operator" type="button" data-insert="&#215;" aria-label="Multiply">&#215;</button>

          <button class="calculator-key calculator-key-number" type="button" data-insert="4">4</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="5">5</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="6">6</button>
          <button class="calculator-key calculator-key-operator" type="button" data-insert="-" aria-label="Subtract">&#8722;</button>
          <button class="calculator-key calculator-key-operator" type="button" data-insert="+" aria-label="Add">+</button>

          <button class="calculator-key calculator-key-number" type="button" data-insert="1">1</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="2">2</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="3">3</button>
          <button class="calculator-key calculator-key-number" type="button" data-action="sign" aria-label="Change sign">&#177;</button>
          <button class="calculator-key calculator-key-function" type="button" data-insert="^3">x<sup>3</sup></button>

          <button class="calculator-key calculator-key-number calculator-key-zero" type="button" data-insert="0">0</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert=".">.</button>
          <button class="calculator-key calculator-key-number" type="button" data-insert="00">00</button>
          <button class="calculator-key calculator-key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
        <p class="calculator-status" id="calculator-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer calculator-footer">
    <span class="brand-footer">Advanced Maths for GCSE</span>
    <a href="subjects.html">Explore subjects</a>
    <span>&copy; 2026</span>
  </footer>
</body>
</html>
